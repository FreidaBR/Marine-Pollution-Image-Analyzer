name: PR Checks

# Quality gate for every Pull Request into the main development branch.
# Jobs run in parallel; each installs only what it needs and uses lockfile-based,
# cached dependency installs to keep the pipeline fast.

on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-checks-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (lint, format, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Check formatting (Prettier)
        run: npm run format:check

      - name: Lint (ESLint)
        run: npm run lint

      - name: Run frontend unit tests
        run: npm test

      - name: Build
        run: npm run build

  python:
    name: Python (${{ matrix.service }}) — lint, format, test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [backend, ai_service, reporting]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          if [ -f "${{ matrix.service }}/requirements.txt" ]; then
            pip install -r "${{ matrix.service }}/requirements.txt"
          fi

      - name: Lint (ruff check)
        run: ruff check "${{ matrix.service }}"

      - name: Check formatting (ruff format)
        run: ruff format --check "${{ matrix.service }}"

      - name: Run tests (pytest)
        # This service's test suite is still a placeholder (no test files yet).
        # Pytest exits 5 when zero tests are collected; treat that as "nothing to
        # run yet" rather than a failure, while still failing on real test failures.
        run: |
          pytest "${{ matrix.service }}" && exit 0
          code=$?
          if [ "$code" -eq 5 ]; then
            echo "No tests collected yet for ${{ matrix.service }} — skipping."
            exit 0
          fi
          exit "$code"

  security:
    name: Dependency security scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Audit npm dependencies
        working-directory: frontend
        # Advisory only for now: this is an early-stage scaffold and audit noise
        # shouldn't block PRs before the dependency tree stabilizes.
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit Python dependencies (backend)
        run: pip-audit -r backend/requirements.txt
        continue-on-error: true

      - name: Audit Python dependencies (ai_service)
        run: pip-audit -r ai_service/requirements.txt
        continue-on-error: true
