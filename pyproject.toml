[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
  "ai_service/model",
  "ai_service/sample_outputs",
  "sample_data",
]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["backend/tests", "reporting/tests"]
python_files = ["test_*.py", "*_test.py"]
